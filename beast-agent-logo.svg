<svg viewBox="0 0 900 300" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <style>
      .wordmark { font-family: 'Baloo 2', 'Poppins', 'Segoe UI', sans-serif; }
    </style>
  </defs>

  <rect width="900" height="300" fill="#FFF8EC"/>

  <!-- Icon badge -->
  <g transform="translate(150,150)">
    <circle cx="0" cy="0" r="118" fill="#FDEFD8" stroke="#2B2118" stroke-width="6"/>

    <!-- ears -->
    <circle cx="-62" cy="-68" r="30" fill="#E8A33D" stroke="#2B2118" stroke-width="6"/>
    <circle cx="62" cy="-68" r="30" fill="#E8A33D" stroke="#2B2118" stroke-width="6"/>
    <circle cx="-62" cy="-68" r="13" fill="#C1421A"/>
    <circle cx="62" cy="-68" r="13" fill="#C1421A"/>

    <!-- head -->
    <path d="M -88 -20
             C -88 -85 -50 -118 0 -118
             C 50 -118 88 -85 88 -20
             C 88 40 58 85 0 85
             C -58 85 -88 40 -88 -20 Z"
          fill="#E8A33D" stroke="#2B2118" stroke-width="6"/>

    <!-- blush -->
    <ellipse cx="-58" cy="14" rx="16" ry="11" fill="#F2A98C" opacity="0.8"/>
    <ellipse cx="58" cy="14" rx="16" ry="11" fill="#F2A98C" opacity="0.8"/>

    <!-- eyes -->
    <circle cx="-32" cy="-18" r="13" fill="#2B2118"/>
    <circle cx="32" cy="-18" r="13" fill="#2B2118"/>
    <circle cx="-28" cy="-22" r="4" fill="#FFF8EC"/>
    <circle cx="36" cy="-22" r="4" fill="#FFF8EC"/>

    <!-- open happy mouth -->
    <path d="M -40 22 C -20 58 20 58 40 22 C 20 36 -20 36 -40 22 Z"
          fill="#C1421A" stroke="#2B2118" stroke-width="5" stroke-linejoin="round"/>
    <polygon points="-24,25 -18,25 -21,38" fill="#FFF8EC"/>
    <polygon points="-5,29 5,29 0,42" fill="#FFF8EC"/>
    <polygon points="18,25 24,25 21,38" fill="#FFF8EC"/>
  </g>

  <!-- Wordmark -->
  <g class="wordmark" transform="translate(300,0)">
    <text x="0" y="150" font-size="82" font-weight="800" fill="#2B2118" letter-spacing="1">Beast</text>
    <text x="0" y="215" font-size="82" font-weight="800" fill="#C1421A" letter-spacing="1">Agent</text>
    <text x="4" y="252" font-size="24" font-weight="600" font-style="italic" fill="#7A8B5E">feed the beast</text>

    <!-- fork & knife flourish -->
    <g transform="translate(285,235)" stroke="#7A8B5E" stroke-width="4" stroke-linecap="round" fill="none">
      <line x1="0" y1="-14" x2="0" y2="14"/>
      <line x1="-6" y1="-14" x2="-6" y2="-4"/>
      <line x1="-2" y1="-14" x2="-2" y2="-4"/>
      <path d="M -6 -4 C -6 2 -2 2 -2 -4"/>
      <line x1="14" y1="-14" x2="14" y2="14"/>
      <path d="M 8 -14 C 8 -6 14 -6 14 -6 C 14 -6 20 -6 20 -14"/>
    </g>
  </g>
</svg>
