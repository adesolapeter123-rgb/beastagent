<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Beastagent | Receipt</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="container nav">
        <div class="brand">
          <span class="brand-mark">
            <img src="./beast-agent-logo.svg" alt="Beastagent logo" />
          </span>
          <div>
            <p class="brand-name">Beastagent</p>
            <small>Fresh snacks delivered fast</small>
          </div>
        </div>
      </div>
    </header>

    <main class="page-shell">
      <section class="receipt-panel container">
        <div class="receipt-box">
          <div class="receipt-header">
            <div>
              <p class="eyebrow">Receipt</p>
              <h1>Payment sent</h1>
            </div>
            <span class="status-badge status-sent">Sent</span>
          </div>

          <div id="receipt-content" class="receipt-content">
            <div class="receipt-card">
              <div class="receipt-top">
                <div>
                  <span class="small-label">Order ID</span>
                  <h2 id="receipt-order-id">--</h2>
                </div>
                <div class="text-right">
                  <span class="small-label">Status</span>
                  <p class="receipt-status">Confirmed</p>
                </div>
              </div>

              <div id="receipt-items" class="receipt-items"></div>

              <div class="receipt-summary">
                <div class="summary-row">
                  <span>Subtotal</span>
                  <strong id="receipt-subtotal">₦0</strong>
                </div>
                <div class="summary-row">
                  <span>Delivery</span>
                  <strong id="receipt-delivery">₦0</strong>
                </div>
                <div class="summary-row total">
                  <span>Total</span>
                  <strong id="receipt-total">₦0</strong>
                </div>
              </div>
            </div>
          </div>

          <div class="receipt-actions">
            <a href="index.html" class="primary-btn">Back to menu</a>
          </div>
        </div>
      </section>
    </main>

    <script>
      const formatMoney = (amount) => `₦${amount.toLocaleString()}`;

      async function loadReceipt() {
        const params = new URLSearchParams(window.location.search);
        const orderId = params.get('orderId');

        if (!orderId) {
          document.getElementById('receipt-content').innerHTML = `
            <div class="receipt-card empty-state">
              <p>No receipt was found.</p>
            </div>
          `;
          return;
        }

        try {
          const response = await fetch(`/api/orders/${orderId}`);
          const data = await response.json();

          if (!response.ok) {
            throw new Error(data.error || 'Unable to load receipt.');
          }

          document.getElementById('receipt-order-id').textContent = data.id.slice(0, 8).toUpperCase();
          document.getElementById('receipt-subtotal').textContent = formatMoney(data.subtotal);
          document.getElementById('receipt-delivery').textContent = formatMoney(data.delivery);
          document.getElementById('receipt-total').textContent = formatMoney(data.total);

          document.getElementById('receipt-items').innerHTML = data.items
            .map(
              (item) => `
                <div class="invoice-row">
                  <div>
                    <strong>${item.name}</strong>
                    <small>${item.qty} x ${formatMoney(item.price)}</small>
                  </div>
                  <span>${formatMoney(item.price * item.qty)}</span>
                </div>
              `
            )
            .join('');
        } catch (error) {
          document.getElementById('receipt-content').innerHTML = `
            <div class="receipt-card empty-state">
              <p>${error.message}</p>
            </div>
          `;
        }
      }

      loadReceipt();
    </script>
  </body>
</html>
